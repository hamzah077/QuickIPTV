# اختبار حي على محاكي أندرويد مع سيرفر Xtream وهمي، ويحفظ لقطات الشاشة في فرع ci-shots
name: UI test

on:
  push:
    branches: [uitest]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: chmod +x gradlew && ./gradlew --no-daemon :app:assembleRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Start mock server
        run: nohup python3 ci/mock_xtream.py > mock.log 2>&1 &
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb root || true
            sleep 3
            adb shell setprop persist.sys.locale ar-SA || true
            adb shell stop && adb shell start || true
            sleep 25
            adb wait-for-device
            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do sleep 2; done
            sleep 5
            adb install -r app/build/outputs/apk/release/app-universal-release.apk
            adb logcat -c
            python3 ci/drive.py shots || true
            adb logcat -d > shots/logcat.txt || true
      - name: Save results to ci-shots branch
        if: always()
        run: |
          mkdir -p shots; cp mock.log shots/ || true
          cd shots
          git init -q -b ci-shots && git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "shots ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-shots
