# تجربة واجهة التلفزيون على محاكي Android TV (بالريموت بس)
name: TV test

on:
  push:
    branches: [uitest]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tv:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: chmod +x gradlew && ./gradlew --no-daemon :app:assembleRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Start mock server
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null 2>&1 || true
          mkdir -p ci/hls && ffmpeg -loglevel error -f lavfi -i testsrc=size=640x360:rate=25 -t 120 -c:v libx264 -pix_fmt yuv420p -b:v 400k -f hls -hls_time 4 -hls_list_size 0 -hls_segment_filename ci/hls/seg%03d.ts ci/hls/index.m3u8 || true
          head -c 2000000 /dev/urandom > ci/test.mp4
          nohup python3 ci/mock_xtream.py > mock.log 2>&1 &
      - name: Run on Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86
          target: android-tv
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/release/app-universal-release.apk
            python3 ci/drive_tv.py shots || true
            adb logcat -d > shots/logcat.txt || true
      - name: Save results to ci-tv branch
        if: always()
        run: |
          mkdir -p shots; cp mock.log shots/ || true
          cd shots
          git init -q -b ci-tv && git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "tv shots ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-tv
