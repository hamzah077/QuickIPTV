# يبني ملفات APK تلقائياً مع كل رفع للمشروع، أو يدوياً من تبويب Actions ← Build APK ← Run workflow
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK موجود مسبقاً على أجهزة GitHub (ANDROID_HOME)، وGradle ينزّل الناقص تلقائياً
      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: QuickIPTV-apk
          path: app/build/outputs/apk/release/*.apk
