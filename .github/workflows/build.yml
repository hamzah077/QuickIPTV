# يبني ملفات APK تلقائياً مع كل رفع للمشروع، أو يدوياً من تبويب Actions ← Build APK ← Run workflow
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write      # عشان ينشر الـ APK في صفحة Releases (رابط تنزيل مباشر)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK موجود مسبقاً على أجهزة GitHub (ANDROID_HOME)، وGradle ينزّل الناقص تلقائياً
      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: URROX-apk
          path: app/build/outputs/apk/release/*.apk

      # رابط تنزيل مباشر: github.com/<user>/URROX-Player/releases/latest
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: URROX Player 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            - URROX-universal-release.apk: يشتغل على كل الأجهزة (إذا مو متأكد نزّل هذا)
            - URROX-armeabi-v7a-release.apk: أصغر — أغلب أجهزة TV Box والجوالات القديمة
            - URROX-arm64-v8a-release.apk: أصغر — الجوالات والأجهزة الحديثة
          files: app/build/outputs/apk/release/*.apk
