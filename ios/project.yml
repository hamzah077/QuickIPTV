# مشروع URROX للآيفون والآيباد (XcodeGen يولّد ملف Xcode من هذا الملف)
# على الماك:  brew install xcodegen  ثم  cd ios && xcodegen  ثم افتح URROX.xcodeproj
name: URROX
options:
  bundleIdPrefix: com.urrox
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
packages:
  # VLCKit: يشغّل كل الصيغ (MKV، AVI، TS…) اللي مشغّل آبل ما يدعمها
  VLCKitSPM:
    url: https://github.com/koombea/vlckit-spm
    from: 3.6.0
  # MPV (تجريبي): libmpv + FFmpeg — نسخة LGPL
  MPVKit:
    url: https://github.com/mpvkit/MPVKit
    exactVersion: 0.41.0
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: ar
targets:
  URROX:
    type: application
    platform: iOS
    sources:
      - path: URROX
    dependencies:
      - package: VLCKitSPM
      - package: MPVKit
        product: MPVKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.urrox.player
        PRODUCT_NAME: URROX
        TARGETED_DEVICE_FAMILY: "1,2"          # آيفون + آيباد
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "URROX Player"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"      # الآيفون: عمودي دايماً (المشغّل بملء الشاشة يلف الفيديو بنفسه)
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # شريط الحالة (الساعة والبطارية): بدون لون ثابت — يتبع الفاتح/الليلي تلقائياً
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    info:
      path: URROX/Info.plist
      properties:
        CFBundleDisplayName: "URROX Player"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]              # صورة داخل صورة + الصوت بالخلفية
        # سيرفرات IPTV غالباً http. تنبيه: لا تضيف NSAllowsArbitraryLoadsForMedia هنا —
        # وجوده يخلّي iOS يتجاهل NSAllowsArbitraryLoads ويمنع اتصال http للـ API
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIRequiresFullScreen: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  # اختبار جولة تلقائي (لقطات شاشة على المحاكي في GitHub) — ما يدخل في التطبيق نفسه
  URROXUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: URROXUITests
    dependencies:
      - target: URROX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.urrox.player.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: URROX
schemes:
  URROX:
    build:
      targets:
        URROX: all
        URROXUITests: [test]
    # التشغيل من Xcode على الجوال بنسخة Release (محسّنة): نسخة Debug بطيئة ومعلّقة مع القوائم الكبيرة
    run:
      config: Release
      # مكتبة MPV (MoltenVK) تكرش مع فحص Metal اللي يشغّله Xcode وقت التشغيل منه — نطفيه (تنبيه MPVKit نفسها)
      enableGPUValidationMode: false
      # وقت التشغيل من Xcode: فاحص الخيط الرئيسي ما يوقف التطبيق لما MPV يرسم من خيطه الخاص
      disableMainThreadChecker: true
    test:
      targets:
        - URROXUITests
