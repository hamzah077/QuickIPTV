# مشروع QuickTv للآيفون والآيباد (XcodeGen يولّد ملف Xcode من هذا الملف)
# على الماك:  brew install xcodegen  ثم  cd ios && xcodegen  ثم افتح QuickTv.xcodeproj
name: QuickTv
options:
  bundleIdPrefix: com.quicktv
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
packages:
  # VLCKit: يشغّل كل الصيغ (MKV، AVI، TS…) اللي مشغّل آبل ما يدعمها
  VLCKitSPM:
    url: https://github.com/koombea/vlckit-spm
    from: 3.6.0
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: ar
targets:
  QuickTv:
    type: application
    platform: iOS
    sources:
      - path: QuickTv
    dependencies:
      - package: VLCKitSPM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quicktv.app
        PRODUCT_NAME: QuickTv
        TARGETED_DEVICE_FAMILY: "1,2"          # آيفون + آيباد
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: QuickTv
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    info:
      path: QuickTv/Info.plist
      properties:
        CFBundleDisplayName: QuickTv
        UILaunchScreen: {}
        UIBackgroundModes: [audio]              # صورة داخل صورة + الصوت بالخلفية
        NSAppTransportSecurity:                 # سيرفرات IPTV غالباً http
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsForMedia: true
        UIRequiresFullScreen: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  # اختبار جولة تلقائي (لقطات شاشة على المحاكي في GitHub) — ما يدخل في التطبيق نفسه
  QuickTvUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: QuickTvUITests
    dependencies:
      - target: QuickTv
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quicktv.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: QuickTv
schemes:
  QuickTv:
    build:
      targets:
        QuickTv: all
        QuickTvUITests: [test]
    test:
      targets:
        - QuickTvUITests
